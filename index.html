    input[type="number"], input[type="text"] { width: 100px; }
    .header, .footer { margin: 20px 0; }
    .address { width: 600px !important; }

    /* --- 懸浮按鈕群組樣式 (收納優化) --- */
    .fab-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 9999;
    }
    .fab-menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .fab-container.active .fab-menu {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .fab-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }
    .fab-btn:hover { transform: scale(1.05); }

    /* 按鈕獨立配色 */
    .fab-btn.main-fab { background-color: #343a40; font-size: 16px; }
    .fab-btn.main-fab:hover { background-color: #23272b; }
    
    .fab-btn.undo { background-color: #007bff; }
    .fab-btn.undo:hover { background-color: #0056b3; }
    
    .fab-btn.redo { background-color: #fd7e14; }
    .fab-btn.redo:hover { background-color: #e86e04; }

    .fab-btn.delete { background-color: #dc3545; }
    .fab-btn.delete:hover { background-color: #c82333; }
    
    .fab-btn.compare { background-color: #17a2b8; }
    .fab-btn.compare:hover { background-color: #138496; }

    .fab-btn.calc { background-color: #28a745; }
    .fab-btn.calc:hover { background-color: #218838; }

    /* 列內操作按鈕樣式 */
    .del-row-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .del-row-btn:hover { background-color: #c82333; }
  </style>

/* -----------------------------
   刪除與比照模式開關控制
------------------------------ */
let isDeleteMode = false;
let isCompareMode = false;

function toggleDeleteMode() {
  isDeleteMode = !isDeleteMode;
  document.querySelectorAll('.action-col').forEach(el => el.style.display = (isDeleteMode || isCompareMode) ? '' : 'none');
  document.querySelectorAll('.del-row-btn').forEach(el => el.style.display = isDeleteMode ? 'inline-block' : 'none');
}

function toggleCompareMode() {
  if (!isCompareMode) {
    isCompareMode = true;
    document.querySelectorAll('.action-col').forEach(el => el.style.display = '');
    document.querySelectorAll('.compare-input').forEach(el => el.style.display = 'inline-block');
  } else {
    saveState();
    for (let i = 1; i <= rowCount; i++) {
      const compareInput = document.getElementById(`compare${i}`);
      const cropInput = document.getElementById(`crop${i}`);
      const baseCropInput = document.getElementById(`baseCrop${i}`);
      
      if (compareInput && cropInput && compareInput.style.display !== 'none') {
        const compareVal = compareInput.value.trim();
        if (compareVal !== '') {
          if (!baseCropInput.value) {
            baseCropInput.value = cropInput.value; 
          }
          const temp = cropInput.value;
          cropInput.value = compareInput.value;
          compareInput.value = temp;
          
          if (cropInput.value !== baseCropInput.value) {
            cropInput.readOnly = true;
            cropInput.style.backgroundColor = "#f0f0f0";
            const sourceLink = document.getElementById(`sourceLink${i}`);
            if(sourceLink) sourceLink.style.display = 'none';
          } else {
            cropInput.readOnly = false;
            cropInput.style.backgroundColor = "";
            updateRow(i); 
          }
        }
      }
    }
    isCompareMode = false;
    document.querySelectorAll('.compare-input').forEach(el => el.style.display = 'none');
    if (!isDeleteMode) {
      document.querySelectorAll('.action-col').forEach(el => el.style.display = 'none');
    }
  }
}

function removeSpecificRow(id) {
  saveState();
  const row = document.getElementById(`row${id}`);
  if (row) {
    row.remove();
    updateSum();
  }
}

/* -----------------------------
   狀態歷史紀錄（復原與取消復原）
------------------------------ */
let historyStack = [];
let redoStack = [];

function getCurrentState() {
  const state = [];
  for (let i = 1; i <= rowCount; i++) {
    const cropEl = document.getElementById(`crop${i}`);
    if (!cropEl) continue; 
    
    state.push({
      crop: cropEl.value,
      baseCrop: document.getElementById(`baseCrop${i}`).value,
      compare: document.getElementById(`compare${i}`).value,
      grade: document.getElementById(`grade${i}`).value,
      qty: document.getElementById(`qty${i}`).value,
      note: document.getElementById(`note${i}`).value
    });
  }
  return state;
}

function saveState() {
  historyStack.push(getCurrentState());
  if (historyStack.length > 20) historyStack.shift(); 
  redoStack = []; 
}

function restoreState(state) {
  document.getElementById("tableBody").innerHTML = "";
  rowCount = 0;
  isDeleteMode = false;
  isCompareMode = false;
  document.querySelectorAll('.action-col').forEach(el => el.style.display = 'none');

  state.forEach(data => {
    addRow(false);
    const i = rowCount;
    document.getElementById(`crop${i}`).value = data.crop;
    document.getElementById(`baseCrop${i}`).value = data.baseCrop || "";
    document.getElementById(`compare${i}`).value = data.compare || "";
    
    if (data.baseCrop && data.crop !== data.baseCrop) {
        document.getElementById(`crop${i}`).readOnly = true;
        document.getElementById(`crop${i}`).style.backgroundColor = "#f0f0f0";
    }

    updateGradeOptions(i);
    document.getElementById(`grade${i}`).value = data.grade;
    document.getElementById(`qty${i}`).value = data.qty;
    document.getElementById(`note${i}`).value = data.note;
    updateRow(i); 
  });
  updateSum(); 
}

function undoAction() {
  if (historyStack.length === 0) { alert("已經是最早的狀態了！"); return; }
  redoStack.push(getCurrentState());
  const previousState = historyStack.pop();
  restoreState(previousState);
}

function redoAction() {
  if (redoStack.length === 0) { alert("沒有可以重做的步驟！"); return; }
  historyStack.push(getCurrentState());
  const nextState = redoStack.pop();
  restoreState(nextState);
}

/* -----------------------------
   更新等級與資料
------------------------------ */
function updateGradeOptions(id) {
  const baseCropInput = document.getElementById(`baseCrop${id}`);
  const cropEl = document.getElementById(`crop${id}`);
  const isSwapped = (baseCropInput && baseCropInput.value && cropEl.value !== baseCropInput.value);
  const cropName = isSwapped ? baseCropInput.value.trim() : cropEl.value.trim();
  
  const gradeSelect = document.getElementById(`grade${id}`);
  gradeSelect.innerHTML = "<option value=''>選擇</option>";

  const grades = cropDB.filter(d => d.crop === cropName).map(d => d.grade);
  grades.forEach(g => {
    const opt = document.createElement("option");
    opt.value = g;
    opt.text = g;
    gradeSelect.appendChild(opt);
  });

  document.getElementById(`sourceLink${id}`).style.display = "none";
  updateRow(id);
}

function updateRow(id) {
  const baseCropInput = document.getElementById(`baseCrop${id}`);
  const cropEl = document.getElementById(`crop${id}`);
  if(!cropEl) return;

  const isSwapped = (baseCropInput && baseCropInput.value && cropEl.value !== baseCropInput.value);
  const crop = isSwapped ? baseCropInput.value.trim() : cropEl.value.trim();
  
  const grade = document.getElementById(`grade${id}`).value;
  const qty = parseFloat(document.getElementById(`qty${id}`).value) || 0;
  const sourceLink = document.getElementById(`sourceLink${id}`);
  
  const item = cropDB.find(d => d.crop === crop && d.grade === grade);

  if (item) {
    document.getElementById(`price${id}`).innerText = item.price.toLocaleString();
    document.getElementById(`unit${id}`).innerText = item.unit;

    // 將面積計算四捨五入至小數點第二位
    const area = Math.round(qty * item.unitArea * 100) / 100;
    const amount = Math.round(qty * item.price);

    // 套用小數點第二位顯示格式
    document.getElementById(`area${id}`).innerText = area.toLocaleString(undefined, { maximumFractionDigits: 2 });
    document.getElementById(`amount${id}`).innerText = amount.toLocaleString();
    document.getElementById(`comp${id}`).innerText = amount.toLocaleString();

    if (!isSwapped) {
      sourceLink.style.display = "inline-block";
      const targetPage = "https://ch20006313.github.io/Assessment-system/%E5%B1%8F%E6%9D%B1%E8%BE%B2%E4%BD%9C%E7%89%A9(114%E5%B9%B4%E7%89%88)%E9%99%84%E8%A1%A8%E4%B8%80%E4%BA%8C%E4%B8%89.html";
      const searchText = item.searchKey || item.crop; 
      const priceText = document.getElementById(`price${id}`).innerText;
      sourceLink.href = `${targetPage}?search=${encodeURIComponent(searchText)}&price=${encodeURIComponent(priceText)}`;
    } else {
      sourceLink.style.display = "none";
    }
  } else {
    document.getElementById(`price${id}`).innerText = "";
    document.getElementById(`unit${id}`).innerText = "";
    document.getElementById(`area${id}`).innerText = "0";
    document.getElementById(`amount${id}`).innerText = "0";
    document.getElementById(`comp${id}`).innerText = "0";
    sourceLink.style.display = "none";
  }
  updateSum();
}

function updateSum() {
  let sumArea = 0, sumAmount = 0, sumComp = 0;
  for (let i = 1; i <= rowCount; i++) {
    const areaEl = document.getElementById(`area${i}`);
    if(!areaEl) continue; 
    sumArea += parseFloat(areaEl.innerText.replace(/,/g, "")) || 0;
    sumAmount += parseFloat(document.getElementById(`amount${i}`).innerText.replace(/,/g, "")) || 0;
    sumComp += parseFloat(document.getElementById(`comp${i}`).innerText.replace(/,/g, "")) || 0;
  }
  
  // 總計也進行小數點第二位的四捨五入與格式化
  sumArea = Math.round(sumArea * 100) / 100;
  document.getElementById("sumArea").innerText = sumArea.toLocaleString(undefined, { maximumFractionDigits: 2 });
  document.getElementById("sumAmount").innerText = sumAmount.toLocaleString();
  document.getElementById("sumComp").innerText = sumComp.toLocaleString();
}

function exportToExcel() {
  const docId = document.getElementById("docId").value.trim() || "未命名";
  const filename = docId + ".xls";

  const clonedBody = document.body.cloneNode(true);
  
  clonedBody.querySelectorAll('.no-export, script, button, .fab-container').forEach(el => el.remove());

  const originalInputs = document.body.querySelectorAll("input:not([type='hidden']), select, textarea");
  const clonedInputs = clonedBody.querySelectorAll("input:not([type='hidden']), select, textarea");

  originalInputs.forEach((el, index) => {
    const clonedEl = clonedInputs[index];
    if(!clonedEl) return;
    const span = document.createElement("span");
    span.textContent = el.value.trim();
    span.style.display = "inline-block";
    
    if (el.closest('#PersonaldataTable')) {
        span.style.fontSize = "12pt"; 
    } else {
        span.style.fontSize = "11pt"; 
    }
    clonedEl.replaceWith(span);
  });

  const surveyRows = clonedBody.querySelectorAll('#surveyTable tr');
  surveyRows.forEach(row => {
      if (row.cells.length > 0) {
          const firstCell = row.cells[0]; 
          firstCell.style.width = "40px";
          firstCell.style.minWidth = "40px";
          firstCell.style.maxWidth = "40px";
          firstCell.style.wordWrap = "break-word";  
          firstCell.style.whiteSpace = "normal";    
      }
  });

  const html = `
    <html>
    <head>
      <meta charset="UTF-8">
      <style>
        body, table, td, th, span { font-size: 11pt; font-family: "Microsoft JhengHei", sans-serif; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #000; padding: 11px; text-align: center; }
      </style>
    </head>
    <body>${clonedBody.innerHTML}</body>
    </html>
  `;

  const blob = new Blob(['\ufeff' + html], { type: "application/vnd.ms-excel" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

/* -----------------------------
   計算超植與重新排序
------------------------------ */
function calculateOverplanting() {
  const totalAreaInput = document.getElementById('totalPlantingArea').value;
  if (!totalAreaInput) { alert("請輸入總種植面積！"); return; }
  
  saveState(); 

  let remainingArea = parseFloat(totalAreaInput);
  let rowData = [];
  
  for (let i = 1; i <= rowCount; i++) {
    const cropEl = document.getElementById(`crop${i}`);
    if (!cropEl) continue; 
    
    const baseCropInput = document.getElementById(`baseCrop${i}`);
    const actualCrop = (baseCropInput && baseCropInput.value && cropEl.value !== baseCropInput.value) ? baseCropInput.value.trim() : cropEl.value.trim();
    
    const grade = document.getElementById(`grade${i}`).value;
    const qty = parseFloat(document.getElementById(`qty${i}`).value) || 0;
    const note = document.getElementById(`note${i}`).value.trim();
    
    if (!actualCrop || !grade || qty <= 0) continue; 
    
    const item = cropDB.find(d => d.crop === actualCrop && d.grade === grade);
    if (!item) {
        alert(`無法比對到作物「${actualCrop} - ${grade}」的資料，將不參與計算。`);
        continue;
    }
    
    const valuePerArea = item.price / item.unitArea;
    rowData.push({
      crop: cropEl.value.trim(),
      baseCrop: baseCropInput ? baseCropInput.value : "",
      compare: document.getElementById(`compare${i}`).value,
      grade: grade,
      qty: qty,
      note: note,
      unitArea: item.unitArea,
      valuePerArea: valuePerArea
    });
  }
  
  rowData.sort((a, b) => b.valuePerArea - a.valuePerArea);
  
  let finalRows = [];
  let isOverplantingTriggered = false; // 【防呆標記】是否已經發生過超植

  for (let data of rowData) {
    // 若前方高價值品項已經發生超植，後方所有品項直接標記超植
    if (isOverplantingTriggered) {
       finalRows.push({
          ...data,
          note: data.note ? data.note + " 超植" : "超植",
          isOver: true
       });
       continue;
    }

    let requiredAreaPerUnit = data.unitArea;
    let maxValidQty = Math.floor((remainingArea + 0.000001) / requiredAreaPerUnit);
    
    if (maxValidQty >= data.qty) {
      // 數量全部合規
      finalRows.push({ ...data, isOver: false });
      remainingArea -= data.qty * requiredAreaPerUnit;
    } else if (maxValidQty > 0) {
      // 部分合規，部分超植
      finalRows.push({ ...data, qty: maxValidQty, isOver: false });
      finalRows.push({
         ...data,
         qty: data.qty - maxValidQty,
         note: data.note ? data.note + " 超植" : "超植",
         isOver: true
      });
      remainingArea -= maxValidQty * requiredAreaPerUnit;
      isOverplantingTriggered = true; // 觸發鎖定
    } else {
      // 全部超植
      finalRows.push({
         ...data,
         note: data.note ? data.note + " 超植" : "超植",
         isOver: true
      });
      isOverplantingTriggered = true; // 觸發鎖定
    }
  }
  
  document.getElementById("tableBody").innerHTML = "";
  rowCount = 0;
  isDeleteMode = false;
  isCompareMode = false;
  document.querySelectorAll('.action-col').forEach(el => el.style.display = 'none');
  
  finalRows.forEach(data => {
    addRow(false);
    const i = rowCount;
    document.getElementById(`crop${i}`).value = data.crop;
    document.getElementById(`baseCrop${i}`).value = data.baseCrop || "";
    document.getElementById(`compare${i}`).value = data.compare || "";
    
    if (data.baseCrop && data.crop !== data.baseCrop) {
        document.getElementById(`crop${i}`).readOnly = true;
        document.getElementById(`crop${i}`).style.backgroundColor = "#f0f0f0";
    }

    updateGradeOptions(i);
    document.getElementById(`grade${i}`).value = data.grade;
    document.getElementById(`qty${i}`).value = data.qty;
    document.getElementById(`note${i}`).value = data.note;
    
    updateRow(i);
    
    // 將超植項目的數據歸零
    if (data.isOver) {
      document.getElementById(`price${i}`).innerText = "0";
      document.getElementById(`area${i}`).innerText = "0";
      document.getElementById(`amount${i}`).innerText = "0";
      document.getElementById(`comp${i}`).innerText = "0";
    }
  });
  updateSum();
}
